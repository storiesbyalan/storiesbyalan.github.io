    document.querySelectorAll(".c-card .c-card__text h2").forEach(function (title) {

        const episode = text.match(/^EPISODE\s+(\d+)$/i);
        const story = text.match(/^(.+?),?\s+PART\s+([IVXLCDM]+|\d+)$/i);

        if (!episode && !story) return;

        const card = title.closest(".c-card");

        if (card) {
            card.classList.add("episode");

            if (story) {
                card.classList.add("story-part");
            }
        }

        const label = document.createElement("span");
        label.className = "episode-label";
        label.textContent = episode ? "EPISODE" : story[1].trim();

        const number = document.createElement("span");
        number.className = "episode-number";
        number.textContent = episode ? episode[1] : "PART " + story[2].toUpperCase();

        title.replaceChildren(label, number);
    });
